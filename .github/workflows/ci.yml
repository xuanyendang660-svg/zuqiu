name: CI

on:
  push:
    branches: [main, "model/**"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest

  real-data-backtest:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Install bundled real EPL results and odds
        run: pip install git+https://github.com/AnishKhetani/premier-league-data.git
      - name: Walk-forward train and benchmark on real EPL data
        run: >-
          football-v2 backtest-real
          --start-date 2000-01-01
          --folds 2
          --trees 80
          --min-leaf 3
          --top-k 5
          --output artifacts/epl_backtest.json
          --model-output artifacts/epl_model.joblib
      - name: Print benchmark report
        run: cat artifacts/epl_backtest.json
      - uses: actions/upload-artifact@v4
        with:
          name: epl-v2-backtest-and-model
          path: artifacts/
          retention-days: 14

  wyscout-event-tail-backtest:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]" kloppy>=3.19
      - uses: actions/cache@v4
        with:
          path: .cache/wyscout-repo
          key: wyscout-public-top-five-leagues-v1
      - name: Clone public full-season Wyscout events
        run: |
          if [ ! -d .cache/wyscout-repo/.git ]; then
            rm -rf .cache/wyscout-repo
            git clone --depth 1 https://github.com/koenvo/wyscout-soccer-match-event-dataset.git .cache/wyscout-repo
          fi
      - name: Run full-season event-tail walk-forward test
        run: >-
          python scripts/run_wyscout_event_backtest.py
          --data-root .cache/wyscout-repo
          --workers 8
          --folds 3
          --initial-train-fraction 0.55
          --output artifacts/wyscout_event_tail.json
      - name: Print Wyscout event-tail report
        run: cat artifacts/wyscout_event_tail.json
      - uses: actions/upload-artifact@v4
        with:
          name: wyscout-event-tail-report
          path: artifacts/wyscout_event_tail.json
          retention-days: 14
