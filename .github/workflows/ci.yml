name: CI

on:
  push:
    branches: [main, "model/**"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - name: Run focused halftime search test
        run: |
          mkdir -p artifacts
          set +e
          pytest -q tests/test_halftime_state_search.py -vv \
            > artifacts/halftime_state_test.log 2>&1
          status=$?
          cat artifacts/halftime_state_test.log
          exit $status
      - name: Run full test suite
        run: |
          set +e
          pytest > artifacts/full_test.log 2>&1
          status=$?
          cat artifacts/full_test.log
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-diagnostics
          path: artifacts/
          retention-days: 7

  halftime-state-validation:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - uses: actions/cache@v4
        with:
          path: .cache/football-data-halftime
          key: football-data-halftime-2000-2026-v1
      - name: Run halftime two-nil validation
        run: |
          mkdir -p artifacts
          python scripts/run_halftime_two_nil_validation.py \
            --cache-dir .cache/football-data-halftime \
            --start-year 2000 \
            --end-year 2025 \
            --output artifacts/halftime_two_nil_validation.json \
            > artifacts/halftime_two_nil_validation.log 2>&1
          cat artifacts/halftime_two_nil_validation.log
      - name: Run nested halftime state search
        run: |
          python scripts/run_halftime_state_search.py \
            --cache-dir .cache/football-data-halftime \
            --start-year 2000 \
            --end-year 2025 \
            --train-end-year 2011 \
            --calibration-end-year 2017 \
            --output artifacts/halftime_state_search.json \
            > artifacts/halftime_state_search.log 2>&1
          cat artifacts/halftime_state_search.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halftime-state-validation
          path: artifacts/
          retention-days: 14
