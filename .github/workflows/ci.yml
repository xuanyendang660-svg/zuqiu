name: CI

on:
  push:
    branches: [main, "model/**"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest

  goal-pairing-audit:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - uses: actions/cache@v4
        with:
          path: .cache/wyscout-repo
          key: wyscout-live-dynamic-v1
      - name: Clone public Wyscout events
        run: |
          if [ ! -d .cache/wyscout-repo/.git ]; then
            rm -rf .cache/wyscout-repo
            git clone --depth 1 https://github.com/koenvo/wyscout-soccer-match-event-dataset.git .cache/wyscout-repo
          fi
          rm -rf .cache/wyscout-repo/processed
          ln -s processed-v2 .cache/wyscout-repo/processed
      - name: Audit goalkeeper-primary goal pairing gaps
        run: |
          mkdir -p artifacts
          python scripts/run_wyscout_goal_pairing_audit.py \
            --data-root .cache/wyscout-repo \
            --output artifacts/wyscout_goal_pairing_audit.json \
            > artifacts/wyscout_goal_pairing_audit.log 2>&1
          cat artifacts/wyscout_goal_pairing_audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wyscout-goal-pairing-audit
          path: artifacts/
          retention-days: 14
