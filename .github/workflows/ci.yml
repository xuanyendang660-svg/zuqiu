name: value-engine-ci

on:
  push:
    branches: [main, "profit/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest
      - run: football-value select examples/markets.json --pretty
      - run: football-value backtest examples/settled.json --pretty
