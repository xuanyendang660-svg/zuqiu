name: CI

on:
  push:
    branches: [main, "model/**"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest

  statsbomb-live-state-validation:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - uses: actions/cache@v4
        with:
          path: .cache/statsbomb
          key: statsbomb-elo-live-state-v1
      - name: Run cross-source live-state validation
        run: |
          mkdir -p artifacts
          set +e
          python scripts/run_statsbomb_elo_live_state.py \
            --cache-dir .cache/statsbomb \
            --workers 12 \
            --max-matches 1800 \
            --output artifacts/statsbomb_elo_live_state.json \
            > artifacts/statsbomb_elo_live_state.log 2>&1
          status=$?
          cat artifacts/statsbomb_elo_live_state.log
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: statsbomb-elo-live-state
          path: artifacts/
          retention-days: 14
