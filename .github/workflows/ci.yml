name: CI

on:
  push:
    branches: [main, "model/**"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest

  wyscout-mechanism-backtest:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - uses: actions/cache@v4
        with:
          path: |
            .cache/wyscout-repo
            .cache/football-data
          key: wyscout-live-dynamic-v1
      - name: Clone public Wyscout events
        run: |
          if [ ! -d .cache/wyscout-repo/.git ]; then
            rm -rf .cache/wyscout-repo
            git clone --depth 1 https://github.com/koenvo/wyscout-soccer-match-event-dataset.git .cache/wyscout-repo
          fi
          rm -rf .cache/wyscout-repo/processed
          ln -s processed-v2 .cache/wyscout-repo/processed
      - name: Run cross-league upset mechanism test
        run: |
          mkdir -p artifacts
          set +e
          python scripts/run_wyscout_mechanism_backtest.py \
            --data-root .cache/wyscout-repo \
            --workers 8 \
            --output artifacts/wyscout_mechanism_tail.json \
            > artifacts/wyscout_mechanism_run.log 2>&1
          status=$?
          cat artifacts/wyscout_mechanism_run.log
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wyscout-mechanism-report
          path: artifacts/
          retention-days: 14
