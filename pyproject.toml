[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exact-score-model"
version = "0.1.0"
description = "Football exact-score model and Football-Data residual training system."
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]
