[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "football-market-model"
version = "0.1.0"
description = "Market-aware, scenario-mixture exact-score modelling with frozen pre-match audit trails."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
analytics = ["penaltyblog>=1.6"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
football-model = "football_model.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/football_model"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
